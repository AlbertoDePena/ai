# The three app services. The backing services are NOT here.
#
# Postgres, S3, Redpanda, Mailpit and Grafana/OTel come from the machine's
# shared local dev stack, which runs as its own compose project and is shared by
# every repo (see the local-dev-stack skill). This project joins that stack's
# network and addresses it by service name.
#
#   ./setup-devstack.sh                 # once per machine: databases, bucket, topic
#   docker compose up -d --build        # the three app services
#   ./migrate.sh                        # apply the app-DB schema (first run)
#   ./run-local.sh {api|worker|consumer}  # one process on the host instead
#
# Start the shared stack first - `./setup-devstack.sh` checks that it is up and
# tells you what to run if it isn't. There is deliberately no `depends_on` on
# the backing services: compose can only express that within one project, and
# these services fail fast on a missing dependency, which is the behaviour we
# want to see anyway.
#
# Credentials come from .env (gitignored; copy .env.example) and must match the
# shared stack's own .env. ${VAR:?...} fails loudly rather than starting a
# service with blank credentials. In prod the backing services become managed
# ones - RDS/Aurora, S3, MSK/Redpanda Cloud, SES, an OTel collector - and this
# file is already only the part that deploys.
name: fastapi-dbos-demo

# The shared dev stack's network, created by that stack, not by this project.
# Its name is <that stack's directory>_default - docker_default for the default
# ~/Developer/docker location. `external: true` means "attach, don't create":
# compose errors out if the stack isn't up, rather than quietly making an empty
# network the app services would then fail to resolve names on.
networks:
  devstack:
    name: ${DEVSTACK_NETWORK:-docker_default}
    external: true

services:

  # ---------------------------------------------------------------------------
  # App services. No container_name: it would break `--scale worker=3` and
  # collide with a sibling project. And no restart policy: these fail fast on a
  # missing database or bad credentials, and you want to see that crash rather
  # than a crash loop hiding it.
  #
  # In-network addresses below are the SHARED stack's service names - postgres,
  # s3, redpanda, mailpit, grafana - which differ from .env's host-side values
  # (localhost, 19092, ...). Both are correct; which applies depends on whether
  # the process runs in a container or on the host.
  # ---------------------------------------------------------------------------

  # HTTP API + dashboard. Writes to S3, enqueues the DBOS workflow, reads the
  # Postgres read model.
  #   http://localhost:8000/dashboard
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    networks: [devstack]
    ports:
      - "8000:8000"
    environment:
      DEV_MODE: "true"                  # flip to false + set AZURE_* to test real auth
      S3_ENDPOINT_URL: http://s3:9000
      S3_FORCE_PATH_STYLE: "true"
      # The shared stack's Silo root credentials. In prod both are unset
      # entirely and the task's IAM role supplies them.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set it in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set it in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Note POSTGRES_PASSWORD_URLENC, not POSTGRES_PASSWORD: these are URLs, so
      # the password must be percent-encoded. See .env.example.
      DBOS_DATABASE_URL: postgresql://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD_URLENC:?set it in .env}@postgres:5432/orders_api_dbos
      # Read model the consumer populates; the API serves it at /processed-orders.
      APP_DATABASE_URL: postgresql://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD_URLENC:?set it in .env}@postgres:5432/orders_api_main
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4317
      OTEL_SERVICE_NAME: order-api
      ENVIRONMENT: local
      # Real Azure AD auth: set DEV_MODE=false above, uncomment these, and put
      # the values in .env (compose interpolates them like the other secrets).
      # AZURE_TENANT_ID: ${AZURE_TENANT_ID}
      # AZURE_CLIENT_ID: ${AZURE_CLIENT_ID}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    # Give uvicorn's graceful shutdown (FastAPI lifespan -> dbos_client.destroy())
    # room before SIGKILL. Docker's default SIGTERM->SIGKILL window is 10s.
    stop_grace_period: 20s

  # DBOS queue worker. Dequeues what the API enqueued, updates S3, sends the
  # confirmation email, publishes the order.processed event.
  #   health: http://localhost:8001/health
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    networks: [devstack]
    ports:
      - "8001:8001"
    environment:
      S3_ENDPOINT_URL: http://s3:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set it in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set it in .env}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DBOS_DATABASE_URL: postgresql://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD_URLENC:?set it in .env}@postgres:5432/orders_api_dbos
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Email: the shared stack's Mailpit (no auth/TLS). For SES/prod, point
      # SMTP_HOST/PORT at the SES SMTP endpoint and set SMTP_USERNAME/
      # SMTP_PASSWORD/SMTP_USE_TLS.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: ${EMAIL_FROM:-orders@example.com}
      # SMTP_USERNAME: ...
      # SMTP_PASSWORD: ...
      # SMTP_USE_TLS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4317
      OTEL_SERVICE_NAME: order-worker
      ENVIRONMENT: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    # uvicorn's graceful shutdown runs the FastAPI lifespan, which drains
    # in-flight DBOS workflows (up to ~12s) and flushes the Kafka producer.
    stop_grace_period: 20s

  # DBOS Kafka consumer. @DBOS.kafka_consumer starts one durable workflow per
  # order.processed event: project it into Postgres, notify a downstream API.
  #   health: http://localhost:8002/health
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    networks: [devstack]
    ports:
      - "8002:8002"
    environment:
      # The read model the consumer's workflow writes - a DIFFERENT database
      # from the DBOS system DB.
      APP_DATABASE_URL: postgresql://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD_URLENC:?set it in .env}@postgres:5432/orders_api_main
      # The SAME system database as the worker and the api: the consumer is not
      # a separate DBOS app, it is a second process of this one. Both register
      # every workflow so either can execute whatever it dequeues or recovers -
      # see consumer.py's docstring.
      DBOS_DATABASE_URL: postgresql://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD_URLENC:?set it in .env}@postgres:5432/orders_api_dbos
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Downstream REST API the workflow notifies. Unset = that step is skipped,
      # which is the default since this stack has no such service.
      EXTERNAL_API_URL: ${EXTERNAL_API_URL:-}
      EXTERNAL_API_TOKEN: ${EXTERNAL_API_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana:4317
      OTEL_SERVICE_NAME: order-consumer
      ENVIRONMENT: local
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    # Lifespan shutdown stops the Kafka poller, drains in-flight workflows
    # (up to ~12s), then closes the HTTP and DB pools.
    stop_grace_period: 20s
