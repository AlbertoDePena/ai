services:
  # Silo — S3-compatible object storage for local dev/testing.
  #   API:     http://localhost:9000
  #   Console: http://localhost:9001
  s3:
    # Pinned to a dated release, not :latest.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # PostgreSQL — local relational database for development/testing.
  #   API:     http://localhost:5432
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:       
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Mailpit — local SMTP server with web UI for testing emails.
  #   Web UI: http://localhost:8025
  #   SMTP:   localhost:1025
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped    
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"
      - "1025:1025"
    volumes:
      - mailpitdata:/data

  # Redpanda — local Kafka-compatible streaming platform for development/testing.
  #   Kafka:   localhost:19092
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --mode=dev-container
    ports:
      - "19092:19092"
    volumes:
      - redpandadata:/var/lib/redpanda/data

  # Redpanda Console — web UI for managing Redpanda clusters.
  #   Web UI: http://localhost:8080
  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda_console
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  # OpenTelemetry LGTM — Grafana + Loki + Tempo + Prometheus + Pyroscope in one
  # container. The local OTLP endpoint for traces/logs/metrics.
  #   Grafana:   http://localhost:3000
  #   OTLP gRPC: http://localhost:4317
  #   OTLP HTTP: http://localhost:4318
  grafana:
    image: grafana/otel-lgtm:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - lgtmdata:/data

volumes:
  miniodata:
  pgdata:
  mailpitdata:
  redpandadata:
  lgtmdata: